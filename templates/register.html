<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | SafeAgent</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #050505;
            --surface: #121212;
            --text-main: #f3f4f6;
            --border: #333333;
            --accent: #4f46e5;
        }
        body {
            font-family: 'Space Grotesk', sans-serif; background-color: var(--bg-color); color: var(--text-main);
            min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 40px 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
        }
        .auth-container { width: 100%; max-width: 450px; padding: 40px; background: transparent; border: none; box-shadow: none; }
        .logo { font-size: 1.5rem; font-weight: 700; color: var(--text-main); text-decoration: none; display: block; text-align: center; margin-bottom: 1rem; letter-spacing: 2px;}
        h2 { font-weight: 300; text-align: center; margin-bottom: 2rem; font-size: 1.5rem; color: #888;}
        
        .form-control { background: transparent; border: none; border-bottom: 1px solid var(--border); border-radius: 0; color: var(--text-main); padding: 12px 0; font-size: 1.1rem; }
        .form-control:focus { background: transparent; box-shadow: none; border-color: var(--accent); color: var(--text-main); }
        .form-label { color: #888; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 0; margin-top: 15px;}
        
        .btn-submit { background: var(--text-main); color: var(--bg-color); width: 100%; padding: 14px; border: none; border-radius: 30px; font-weight: 500; font-size: 1.1rem; margin-top: 2.5rem; transition: all 0.3s ease; }
        .btn-submit:hover { background: var(--accent); color: white; box-shadow: 0 0 20px rgba(79, 70, 229, 0.4); }
        
        .custom-alert { background: rgba(220, 53, 69, 0.1); border: 1px solid rgba(220, 53, 69, 0.3); color: #ff6b6b; border-radius: 8px; font-size: 0.9rem;}
        .custom-alert.success { background: rgba(25, 135, 84, 0.1); border-color: rgba(25, 135, 84, 0.3); color: #4ade80; }
    </style>
</head>
<body>

<div class="auth-container">
    <a href="{{ url_for('index') }}" class="logo">SAFE.AGENT</a>
    <h2>Register Node</h2>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert custom-alert {{ 'success' if category == 'success' else '' }} alert-dismissible fade show text-center" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

   <form method="POST" action="{{ url_for('register') }}">
        <div>
            <label class="form-label">Operator Name</label>
            <input type="text" class="form-control" name="name" required placeholder="Enter your full name">
        </div>
        <div>
            <label class="form-label">System Email</label>
            <input type="email" class="form-control" name="email" required placeholder="Enter your email address">
        </div>
        <div>
            <label class="form-label">Security Key</label>
            <input type="password" class="form-control" name="password" required placeholder="Create a strong password">
            <div style="font-size: 0.8rem; color: #6b7280; margin-top: 8px; letter-spacing: 0.5px;">
                <i class="fa-solid fa-circle-info" style="font-size: 0.7rem; margin-right: 4px;"></i>
                Min. 8 characters. Must include letters, numbers & symbols.
            </div>
        </div>
        <div>
            <label class="form-label">Verify Key</label>
            <input type="password" class="form-control" name="confirm_password" required placeholder="Confirm your password">
        </div>
        <button type="submit" class="btn-submit">Create Authorization</button>
    </form>
    <div class="text-center mt-4" style="color: #666; font-size: 0.9rem;">
        Existing operator? <a href="{{ url_for('login') }}" style="color: var(--text-main); text-decoration: none; border-bottom: 1px solid var(--text-main);">Authenticate here</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
