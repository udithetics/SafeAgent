<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload System | SafeAgent</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-color: #050505;
            --surface: #121212;
            --text-main: #f3f4f6;
            --text-muted: #888888;
            --accent: #4f46e5;
            --border: #262626;
            --success: #10b981;
        }

        body {
            /* Applied the Outfit font here */
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow-x: hidden;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
        }

        /* --- SIDEBAR (Matches Dashboard) --- */
        .wrapper { display: flex; min-height: 100vh; }
        .sidebar { width: 260px; background: var(--surface); border-right: 1px solid var(--border); padding: 24px; display: flex; flex-direction: column; }
        .sidebar-logo { font-size: 1.5rem; font-weight: 700; color: var(--text-main); text-decoration: none; letter-spacing: 1px; margin-bottom: 40px; display: flex; align-items: center; gap: 10px; }
        .nav-item { color: var(--text-muted); text-decoration: none; padding: 12px 16px; border-radius: 8px; margin-bottom: 8px; display: flex; align-items: center; gap: 12px; transition: all 0.3s ease; font-weight: 500; }
        .nav-item:hover, .nav-item.active { background: var(--accent); color: white; }
        .config-box { margin-top: auto; background: var(--bg-color); border: 1px solid var(--border); padding: 16px; border-radius: 12px; }

        /* --- MAIN CONTENT --- */
        .main-content { flex: 1; padding: 40px; max-height: 100vh; overflow-y: auto; }
        .header-top { margin-bottom: 40px; border-bottom: 1px solid var(--border); padding-bottom: 20px;}
        .header-title h2 { font-weight: 700; margin: 0; font-size: 2.2rem; letter-spacing: -0.04em; }
        .header-title p { color: var(--text-muted); margin: 0; font-size: 1rem; margin-top: 5px;}

        /* --- UPLOAD UI STYLES --- */
        .glass-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 40px; max-width: 900px; margin: 0 auto; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        .drop-zone {
            border: 2px dashed var(--border);
            border-radius: 12px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.01);
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .drop-zone:hover {
            border-color: var(--accent);
            background: rgba(79, 70, 229, 0.05);
            transform: translateY(-2px);
        }

        .upload-icon {
            font-size: 2.5rem;
            color: var(--accent);
            margin-bottom: 15px;
            transition: transform 0.3s ease;
        }

        .drop-zone:hover .upload-icon {
            transform: scale(1.1);
        }

        .drop-zone h5 { font-weight: 600; margin-bottom: 5px; color: var(--text-main); font-size: 1.1rem; }
        .drop-zone p { color: var(--text-muted); font-size: 0.9rem; margin: 0; }

        .file-input {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
            z-index: 10;
        }

        .file-status {
            margin-top: 15px;
            font-size: 0.85rem;
            color: var(--success);
            font-weight: 600;
            display: none;
        }

        .btn-audit {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 14px 36px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1.1rem;
            transition: all 0.3s ease;
        }

        .btn-audit:hover {
            background-color: #4338ca;
            box-shadow: 0 0 20px rgba(79, 70, 229, 0.4);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

<div class="wrapper">
    <aside class="sidebar">
        <a href="{{ url_for('index') }}" class="sidebar-logo">
            <i class="fa-solid fa-microchip text-primary"></i> SAFE.AGENT
        </a>
        
        <nav>
            <a href="{{ url_for('dashboard') }}" class="nav-item"><i class="fa-solid fa-chart-line"></i> Dashboard</a>
            <a href="{{ url_for('upload') }}" class="nav-item active"><i class="fa-solid fa-upload"></i> Upload System</a>
            <a href="#" class="nav-item"><i class="fa-solid fa-file-shield"></i> Audit Logs</a>
            <a href="{{ url_for('logout') }}" class="nav-item text-danger mt-4"><i class="fa-solid fa-arrow-right-from-bracket"></i> Terminate Session</a>
        </nav>

        <div class="config-box">
            <div class="card-title" style="margin-bottom: 10px; font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; font-weight: 600; letter-spacing: 0.05em;">Agent Config</div>
            <form action="{{ url_for('dashboard') }}" method="GET">
                <label class="form-label" style="font-size: 0.85rem; color: #888;">Sensitivity</label>
                <select name="sensitivity" class="form-select form-select-sm bg-dark text-light border-secondary">
                    <option value="Medium">Medium (Standard)</option>
                    <option value="High">High (Strict)</option>
                    <option value="Low">Low (Forgiving)</option>
                </select>
            </form>
        </div>
    </aside>

    <main class="main-content">
        <div class="header-top">
            <div class="header-title">
                <h2>System Injection</h2>
                <p>Deploy your trained model and reference dataset for self-auditing.</p>
            </div>
        </div>

        <div class="glass-card">
            <form action="/upload" method="POST" enctype="multipart/form-data" id="uploadForm">
                <div class="d-flex align-items-center mb-5">
                    <span class="badge" style="background-color: rgba(79, 70, 229, 0.2); color: var(--accent); border: 1px solid var(--accent); padding: 8px 14px; font-weight: 600; letter-spacing: 1px; border-radius: 6px;">STEP 01</span>
                    <h4 style="margin: 0; margin-left: 15px; font-weight: 600;">Model & Data Assets</h4>
                </div>
                
                <div class="row g-4 mb-5">
                    <div class="col-md-6">
                        <div class="drop-zone" id="modelZone">
                            <i class="fa-solid fa-box-archive upload-icon"></i>
                            <h5>AI Model</h5>
                            <p>.joblib or .pkl files</p>
                            <input type="file" name="model_file" class="file-input" accept=".joblib,.pkl" onchange="updateFileStatus(this, 'modelStatus')">
                            <div id="modelStatus" class="file-status"><i class="fa-solid fa-check me-1"></i> File Selected</div>
                        </div>
                    </div>
                    
                    <div class="col-md-6">
                        <div class="drop-zone" id="dataZone">
                            <i class="fa-solid fa-file-csv upload-icon"></i>
                            <h5>Reference Data</h5>
                            <p>CSV dataset for baseline</p>
                            <input type="file" name="data_file" class="file-input" accept=".csv" onchange="updateFileStatus(this, 'dataStatus')">
                            <div id="dataStatus" class="file-status"><i class="fa-solid fa-check me-1"></i> File Selected</div>
                        </div>
                    </div>
                </div>
                
                <div class="text-center border-top pt-5" style="border-color: var(--border) !important;">
                    <button type="submit" class="btn-audit">
                        <i class="fa-solid fa-rocket me-2"></i> Run System Audit
                    </button>
                </div>
            </form>
        </div>
    </main>
</div>

<script>
    function updateFileStatus(input, statusId) {
        const statusDiv = document.getElementById(statusId);
        const dropZone = input.parentElement;
        
        if (input.files && input.files.length > 0) {
            // Update text with file name
            statusDiv.innerHTML = `<i class="fa-solid fa-check me-1"></i> ${input.files[0].name}`;
            statusDiv.style.display = 'block';
            
            // Change drop zone styling to match dark theme "success" state
            dropZone.style.borderColor = 'var(--success)';
            dropZone.style.background = 'rgba(16, 185, 129, 0.1)';
        }
    }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
